steps:
  - label: ":python: linting"
    key: lint
    commands: |
      pip install poetry==1.8.3
      poetry config virtualenvs.create false
      poetry install --no-root
      poetry run black --check .
      poetry run isort --check-only .
    plugins:
      - docker#v3.8.0:
          image: registry.twilio.com/library/python/3.10-slim

  - label: ":python: type-check"
    key: type-check
    commands: |
      pip install poetry==1.8.3
      poetry config virtualenvs.create false
      poetry install --no-root
      poetry run mypy taf
    plugins:
      - docker#v3.8.0:
          image: registry.twilio.com/library/python/3.10-slim

  - label: ":python: test-3.8"
    key: test-38
