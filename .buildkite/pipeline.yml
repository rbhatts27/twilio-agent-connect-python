steps:
  - label: ":python: linting"
    key: lint
    commands: |
      pip install uv
      uv venv || exit 1
      . .venv/bin/activate
      uv pip install -e .
      uv run ruff check .
      uv run ruff format --check .
    plugins:
      - docker#v3.8.0:
          image: registry.twilio.com/library/python/3.10-slim

  - label: ":python: type-check"
    key: type-check
    commands: |
      pip install uv
      uv venv || exit 1
      . .venv/bin/activate
      uv pip install -e .
      PYTHONPATH=. uv run mypy src/taf
    plugins:
      - docker#v3.8.0:
          image: registry.twilio.com/library/python/3.10-slim

  - label: ":python: test-3.9"
    key: test-39
    commands: |
      pip install uv
      uv venv || exit 1
      . .venv/bin/activate
      uv sync --group dev
      uv run pytest
    plugins:
      - docker#v3.8.0:
          image: registry.twilio.com/library/python/3.9-slim

