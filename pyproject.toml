[project]
name = "twilio-agentic-framework"
version = "0.0.1"
description = "A Python framework for building agentic applications with Twilio"
authors = [{ name = "Twilio Conversation AI", email = "team_conversational-ai@twilio.com" }]
readme = "README.md"
homepage = "https://github.com/twilio-internal/twilio-agentic-framework-python"
repository = "https://github.com/twilio-internal/twilio-agentic-framework-python"
requires-python = ">=3.9,<4"
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.0.0,<3",
    "requests>=2.31.0,<3",
    "python-dotenv>=1.0.0,<2",
    "twilio>=9.8.3,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.8.0,<1",
    "mypy>=1.0.0,<2",
    "types-requests>=2.31.0,<3",
    "openai>=1.0.0,<2",
    "openai-agents>=0.1.0",
]
voice = [
    "websockets>=13.0,<16",
]

[tool.uv.workspace]
members = ["taf"]

[tool.uv.sources]
taf = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taf"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402", "E501"]  # Allow import order changes and long lines in examples

[tool.ruff.lint.isort]
known-first-party = ["taf"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "taf/tools/examples/.*"
]

# Specify the paths to type check
[[tool.mypy.overrides]]
module = ["src.taf.*", "twilio.*"]  # twilio.* added to ignore missing type stubs
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --cov=src/taf --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/taf"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
