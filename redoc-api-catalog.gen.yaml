openapi: 3.0.0
info:
  title: Memora Domain API for runtime operations.
  description: Welcome to the Memora Domain API documentation.
  version: '1.0'
  license:
    name: Proprietary License
    url: https://www.twilio.com/legal/tos
  x-twilio:
    FILE_IS_AUTO_GENERATED: false
servers:
  - url: http://localhost:3000/v1
    description: Local Dev
  - url: http://memory.stage.twilio.com/v1
    description: Staging
  - url: http://memory.twilio.com/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Architecture
    description: |
      Memora is Twilio’s contextual data layer, enabling AI agents and applications to "remember" customer interactions and access valuable knowledge. Built for scalability and flexibility, Memora ensures that as communication workflows and customer needs evolve, relevant context remains accessible and impactful.

       - [Sierra PRFAQ](https://docs.google.com/document/d/1eYOWAFkJB5Dopme5nTokZelE8Wb0Ape44P3LlLFjqt8/edit?tab=t.0#heading=h.tklq6imnqq9)
       - [Memora PRFAQ](https://docs.google.com/document/u/0/d/1cqFIVeFtONu4H3rWiW6GJ9sCoTj5v6-qJBk6fZanP_A/edit)
       - [Memora ESOD](https://docs.google.com/document/d/1_ZlKjj7AWmLBz0kX8P6Y7ufBHhKCX85jrj8UlN6ABn4/edit?tab=t.7djb3r5bhib6)

      ### Customer Memory

      A "memory" is structured or semi-structured information tied to a Profile.

      1. **Conversational Memory** – High-value transient or semantic context (observations) captured from interactions, content, and model outputs that can power recall.
      2. **Factual Memory** – Durable facts about a profile: identifiers, traits, and events.

      ### Core Objects

      - **[Profile](#tag/Profiles)**: Represents a distinct real-world individual, device, or anonymous session. Profiles aggregate identifiers, traits, events, and observations.
      - **[Identifier](#tag/Identifiers)**: Connects a customer across channels (e.g., John’s phone + email + WhatsApp). Used for resolution and merging.
      - **[Trait](#tag/Traits)**: A fact (key/value) about a profile (e.g., "firstName": "John"), organized into groups (e.g. "Contacts").
      - **[Event](#tag/Events)**: A timestamped action or occurrence (e.g., “SMS sent 2:15pm,” “Email opened 3:22pm”). An immutable resource.
      - **[Observation](#tag/Observations)**: A semantic snippet (≤4KB) of contextual content associated with a profile (e.g., behaviors, summarized conversations, extracted insights) enabling semantic search and recall for agentic workloads.

      ### Knowledge

      Unstructured data sources. Upload organizational knowledge from plain text, csv, docx, pdf, ppt, txt, xlsx, json, tsv, md/mdx, and web URLs.

      Knowledge is currently a Twilio Alpha product and will be included as a Memora capability for the Sierra launch. [Twilio Alpha API Documentation](https://www.twilio.com/docs/alpha/ai-assistants/api/knowledge)

      ## API Guidelines

      ### Development Practices

      Our APIs follow the [Twilio API Standards](https://docs.google.com/document/d/1a7KFcJ6paMut04xaxP5mgns7fdP8dSDS0xMiAi-sMzA/edit) for naming and general conventions.

      **Online Docs**: [Memora APIs](https://twilio-internal.github.io/memora-domain)
      **Code Repository**: [twilio-internal / memora-domain](https://github.com/twilio-internal/memora-domain)

      #### Twilio Type IDs (TTID)

      Memora resources and APIs have adopted Twilio Type IDs as our standard identifier format where applicable, based on [Twilio Wide ADR-0027](https://github.com/twilio-internal/architecture/blob/main/standards/0027-next-generation-sids.md).

      The general format is `{domain}_{resourcename}_{uuidv7-special-encoded}`
      With the Memora domain adopting "mem" as our domain prefix.
      Example: `mem_profile_00000000000000000000000000`

      TTIDs have the properties:

      - **Time Sortable**: UUIDv7 values are time-sortable, which means you can sort them in increasing order based on when they were generated. This makes time-based queries more efficient and intuitive. TTID `{uuidv7-special-encoded}` preserves this property lexigraphically.
      - **Precise Timestamping**: With a granularity of 1 millisecond they offer excellent precision. This, when combined with the randomness, essentially guarantees that collisions (even among globally distributed systems) are nearly impossible.
      - **Global Uniqueness**: Like other UUIDs, UUIDv7 ensures global uniqueness. This means you can generate IDs independently across different systems or nodes, and they won't collide.

      ### API Maturity Levels

      All endpoints in this catalog are currently **[EXPERIMENTAL]** and may evolve.

      API endpoints each have a colored chip tag associated with them that represents one of the following lifecycle stages. This communicates API readiness to consuming teams:

      | Badge | Color | Meaning |
      |-------|-------|---------|
      | **501** | 🟡 `Gold` | Specification only, not implemented |
      | **WIP** | 🟠 `Tomato` | Work in progress with implementation available, expect changes |
      | **PUB** | 🟢 `DarkSeaGreen` | Published to RestProxy for public consumption, expect changes |

      Each operation in our OAS specifications should be tagged with `x-badges` to indicate its current maturity level. Report any out-of-date status to the `#eng-memora` slack channel.

      ### Authentication

      Use [Restricted API Keys](https://www.twilio.com/docs/iam/api-keys/restricted-api-keys) for public access through RestProxy.  For Domain to Domain authentication, work with the Edge team to generate Edge Access Tokens.

      Authentication and authorization use an OAuth flow and require a bearer token (see `bearerAuth` security scheme) in [RFC 7519 - JSON Web Token (JWT) format](https://datatracker.ietf.org/doc/html/rfc7519).

      A JSON Web Token (JWT) is a compact, URL-safe standard for transmitting JSON data securely between two parties, primarily used for authentication and authorization. A JWT consists of three parts (Header, Payload, and Signature) separated by dots, where the signature ensures the token's authenticity and integrity, preventing tampering.

      Memora Services will verify the bearer token against a public key provider and, if permitted, access the token's claims for authorization.

      ### Error Model

      Memora endpoints return structured errors consistent with Twilio platform conventions. Every non-2xx response includes a JSON object matching the `TwilioError` schema defined in `responses/error.yaml`:

      | Field | Type | Description |
      |-------|------|-------------|
      | `code` | integer | Stable Twilio error code identifying the precise failure condition (e.g., `20404` not found, `20500` internal server, `20429` rate limit). Codes allow programmatic branching independent of HTTP status text. |
      | `message` | string | A human readable description of the error. |
      | `more_info` | uri | A URL linking to the Twilio documentation for that specific error code, offering more detailed explanations and troubleshooting steps. Format: `https://www.twilio.com/docs/api/errors/{code}` when published. |
      | `status` | integer | Standard HTTP status code mirrored from the response, for simpler client inspection. |

      #### Standard Examples

      Generic bad request (validation failure):

      ```json
      {
        "code": 400,
        "message": "Failed to complete request due to a bad request",
        "more_info": "https://www.twilio.com/docs/api/errors/400",
        "status": 400
      }
      ```

      Resource not found (profile missing):

      ```json
      {
        "code": 20404,
        "message": "Not Found",
        "more_info": "https://www.twilio.com/docs/api/errors/20404",
        "status": 404
      }
      ```

      Rate limiting (too many requests):

      ```json
      {
        "code": 20429,
        "message": "Too many requests. Please retry according to the Retry-After response header.",
        "more_info": "https://www.twilio.com/docs/api/errors/20429",
        "status": 429
      }
      ```

      ### Observability & Correlation

      When making requests through RestProxy clients will receive a `Twilio-Request-Id` as an HTTP header in the response. This ID is a unique identifier for the API request within Twilio's systems.

      ```http
      Twilio-Request-Id: RQ5cedae4e7e7e4e70937a8198f5d2d1c0
      ```

      ### Rate Limiting

      When you receive a `429` the response will also include a `Retry-After` header (seconds). Recommended client behavior:

      1. Parse `Retry-After` as an integer (fallback to exponential backoff + jitter if absent).
      2. Suspend further requests of the same classification (endpoint + principal) until the window elapses.
      3. Preserve idempotency keys (where applicable) on retried writes.

      TODO: rate limit headers and per-tenant limits. (e.g., `X-RateLimit-Limit`, `X-RateLimit-Remaining`)

