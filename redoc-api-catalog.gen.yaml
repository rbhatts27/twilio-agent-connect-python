    x-traitTag: true
  - name: Profiles
    description: '**API Status:** `[EXPERIMENTAL]` </br></br> Profiles are the core of the Memory APIs. They represent a known or unknown individual, device, or session activity. They contain identifiers, traits, events, and observations.'
  - name: Identifiers
    description: '**API Status:** `[EXPERIMENTAL]` </br></br> Profile identifiers are unique attributes that help to identify and distinguish profiles. They can include email addresses, phone numbers, user IDs, or any other unique identifier relevant to the profile. Identifiers are used for searching, merging, and resolving profiles within the Memory system. Identifier values will be normalized.'
  - name: Traits
    description: '**API Status:** `[EXPERIMENTAL]` </br></br> Profile traits are key value pairs that store facts about a profile. They can contain groups of related traits such as a contact''s name, email, and phone that are brought in via APIs, file imports, or other integrations with third party systems. Trait names are normalized to lowerCamelCase naming conventions.'
  - name: Events
    description: '**API Status:** `[EXPERIMENTAL]` `Writing events is supported but reading events is not.`</br></br> Events are the history of user activities intended to track user engagements.'
  - name: Observations
    description: '**API Status:** `[EXPERIMENTAL]` </br></br> Observations are transient, content-based records associated with profiles that support semantic search and categorization. Each observation contains content (up to 4KB), metadata, and timestamps for creation and updates.'
paths:
  /Services/{serviceId}/Profiles:
    parameters:
      - $ref: '#/components/parameters/XPreAuthContext'
      - $ref: '#/components/parameters/ServiceId'
    get:
      summary: List Profiles
      description: Return a paginated list of profile IDs ordered by most recently created first. Use the optional paging parameters (pageSize, pageToken, orderBy) to control pagination and sorting. This endpoint is optimized for browsing newly created profiles and lightweight lookups where only the identifiers are needed before requesting full profile details.
      tags:
        - Profiles
      x-badges:
        - name: '501'
          color: Gold
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A list of profile IDs up to a maximum of 100.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/ProfileID'
                    example:
                      - mem_profile_00000000000000000000000000
                      - mem_profile_00000000000000000000000001
                      - mem_profile_00000000000000000000000002
                      - mem_profile_00000000000000000000000003
                      - mem_profile_00000000000000000000000004
                      - mem_profile_00000000000000000000000005
                      - mem_profile_00000000000000000000000006
                      - mem_profile_00000000000000000000000007
                      - mem_profile_00000000000000000000000008
                      - mem_profile_00000000000000000000000009
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      summary: Create Profile
      description: Create a new profile and optionally set initial traits. The request synchronously resolves identity and either creates a new profile ID or  retrieves the associated canonical profile ID based on any provided identifier traits present in the request. Any additional traits are queued for asynchronous processing and merged into the canonical profile.
      tags:
        - Profiles
      x-badges:
        - name: WIP
          color: Tomato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWithoutId'
            examples:
              Add Contact:
                value:
                  traits:
                    Contact:
                      email: Alyssa.Mock@example.com
                      phone: '+13175551234'
                      lastName: Mock
                      firstName: Alyssa
                      street: 123 Main St
                      city: San Francisco
                      state: CA
                      postalCode: '94107'
                      country: US
              Unknown Caller (Customer Care):
                value:
                  traits:
                    Contact:
                      phone: '+13175551234'
                      preferredLanguage: en
                    IVR:
                      datetime: '2023-10-05T15:39:25Z'
                      ivrPath: main_menu>technical_support>password_reset
                      languageSelected: en
                    Support:
                      disposition: resolved
              Known New Caller (Customer Care):
                value:
                  traits:
                    Contact:
                      phone: '+13175551234'
                      lastName: Mock
                      firstName: Alyssa
                      preferredLanguage: en
                    Account:
                      accountNumber: '123456'
                    IVR:
                      datetime: '2023-10-05T15:39:25Z'
                      ivrPath: main_menu>technical_support>password_reset>xfer_to_agent
                      languageSelected: en
                    Support:
                      disposition: resolved
      responses:
        '202':
          description: Profile resolved and accepted for processing.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - id
                properties:
                  id:
                    $ref: '#/components/schemas/ProfileID'
                    example: mem_profile_00000000000000000000000000
                  message:
                    type: string
                    example: Profile resolved and accepted for processing.
              examples:
                Accepted:
                  value:
                    message: Profile resolved and accepted for processing.
                    id: mem_profile_00000000000000000000000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /Services/{serviceId}/Profiles/Bulk:
    parameters:
      - $ref: '#/components/parameters/XPreAuthContext'
      - $ref: '#/components/parameters/ServiceId'
    put:
      summary: Bulk Upsert Profiles
      description: Create or update up to 1000 profiles in a single asynchronous batch. Each profile body follows the same structure as single profile creation. If a profile already exists its traits are merged (new keys added, existing keys overwritten). Large batches may take time to process; the 202 response indicates the batch has been accepted. Monitor downstream telemetry or audit logs to confirm completion.
      tags:
        - Bulk Ingest
      x-badges:
        - name: WIP
          color: Tomato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profiles:
                  type: array
                  maxItems: 1000
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ProfileWithoutId'
            example:
              profiles:
                - traits:
                    contact:
                      phone: '+13175551234'
                      email: Alyssa.Mock@example.com
                      lastName: Mock
                      firstName: Alyssa
                - traits:
                    contact:
                      phone: '+13175556789'
                      email: John.Doe@example.com
                      lastName: Doe
                      firstName: John
      responses:
        '202':
          description: Profiles batch accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Profile batch accepted for processing.
              examples:
                Accepted:
                  value:
                    message: Profile batch accepted for processing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /Services/{serviceId}/Profiles/Lookup:
    parameters:
      - $ref: '#/components/parameters/XPreAuthContext'
      - $ref: '#/components/parameters/ServiceId'
    post:
      summary: Lookup Profiles
      description: Find profiles that contain a specific identifier value (for example a phone number or email). Submit an `identifier` string in the form `type:value` (e.g. `phone:+13175556789`). Multiple matches are returned if more than one profile is associated with the identifier. Use this to resolve an inbound signal to one or more profile IDs before fetching richer data.
      tags:
        - Retrieval
      x-badges:
        - name: '501'
          color: Gold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: A list of profiles found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfileID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /Services/{serviceId}/Profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/XPreAuthContext'
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: Get Profile
      description: Retrieve profile traits by profile ID. Use the `traitGroups` query parameter to restrict results to a comma-separated allow list of trait group names. For large sets of traits, prefer using the dedicated `/Traits` endpoint for pagination.
      tags:
        - Profiles
      x-badges:
        - name: '501'
          color: Gold
      parameters:
        - $ref: '#/components/parameters/TraitGroupsQueryParam'
      responses:
        '200':
          description: A profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      summary: Patch Profile Traits
      description: Merge one or more trait groups into an existing profile. Only the traits provided are added or updated; unspecified traits remain unchanged.
      tags:
        - Profiles
      x-badges:
        - name: '501'
          color: Gold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              traits:
                Activity:
                  lastVisited: '2024-10-07T15:39:25Z'
      responses:
        '202':
          description: Trait patch accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Trait modifications accepted for processing.
              examples:
                Accepted:
                  value:
                    message: Trait modifications accepted for processing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Delete Profile
      description: Permanently delete the profile and all associated identifiers and traits. This operation is irreversible. Downstream caches or analytical stores may take time to reflect the deletion. Use cautiously and consider a soft‑delete strategy if regulatory or recovery requirements apply.
      tags:
        - Profiles
      x-badges:
        - name: '501'
          color: Gold
      responses:
        '204':
          description: Profile deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /Services/{serviceId}/Profiles/{profileId}/Identifiers:
    parameters:
      - $ref: '#/components/parameters/XPreAuthContext'
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: List Profile Identifiers
      description: Return a paginated list of identifiers linked to a profile. Use this to audit which external keys (phone, email, userId, etc.) are currently associated. Supports standard paging parameters to iterate through large sets if present.
      tags:
        - Identifiers
      x-badges:
        - name: '501'
          color: Gold
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A list of identifiers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifiers:
                    $ref: '#/components/schemas/Identifier'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      summary: Add Profile Identifier
      description: Asynchronously attach a new identifier to a profile. If the identifier already exists and points to another profile, resolution rules or merge processes may apply (resulting in 4xx errors if conflicts). Use the batch or patch endpoint for modifying multiple identifiers at once.
      tags:
        - Identifiers
      x-badges:
        - name: '501'
          color: Gold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identifier'
            example:
              identifier: phone:+13175556789
      responses:
        '202':
          description: Identifier association accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Identifier accepted for processing.
              examples:
                Accepted:
                  value:
                    message: Identifier accepted for processing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      summary: Patch Profile Identifiers
      description: Add, modify, or remove multiple identifiers in a single request. Provide an array where each entry supplies the current identifier and an optional new value. To add a new identifier specify identical `identifier` and `value` fields. To remove an identifier set `value` to null; missing identifiers are ignored (no error). Use this endpoint to keep identifier sets synchronized without multiple network calls.
      tags:
        - Identifiers
      x-badges:
        - name: '501'
          color: Gold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiers:
                  type: array
                  items:
                    $ref: '#/components/schemas/IdentifierPatch'
      responses:
        '202':
          description: Identifier modifications accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Identifier modifications accepted.
              examples:
                Accepted:
                  value:
                    message: Identifier modifications accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /Services/{serviceId}/Profiles/{profileId}/Traits:
    parameters:
      - $ref: '#/components/parameters/XPreAuthContext'
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: List Profile Traits
      description: Return a paginated, optionally filtered list of individual traits for a profile (flattened view). This is useful for UIs or tools that need to browse trait metadata (names, groups, timestamps). Use the optional `traitGroups` filter to scope results and the paging parameters to iterate through larger sets.
      tags:
        - Traits
      x-badges:
        - name: '501'
          color: Gold
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/TraitGroupsQueryParam'
      responses:
        '200':
          description: A list of traits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  traits:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Trait'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                All Traits:
                  summary: All traits for a profile
                  value:
                    traits:
                      - name: firstName
                        value: Alyssa
                        traitGroup: Contact
                        timestamp: '2025-01-01T12:00:00Z'
                      - name: lastName
                        value: Mock
                        traitGroup: Contact
                        timestamp: '2025-01-01T12:00:00Z'
                      - name: tier
                        value: gold
                        traitGroup: Loyalty
                        timestamp: '2025-01-01T12:30:00Z'
                      - name: points
                        value: '1250'
                        traitGroup: Loyalty
                        timestamp: '2025-01-01T12:30:00Z'
                    meta:
